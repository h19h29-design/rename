name: Windows portable build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests, portable EXE, packaged GUI smoke test
        run: python build_windows.py
      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: RENAME-Windows-x64
          path: |
            dist/RENAME-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v0.1.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create $tag dist/RENAME-Windows-x64.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "RE:NAME Windows preview $tag" --prerelease --notes "Windows x64 portable preview. Extract the full ZIP, then run RENAME/RENAME.exe. Automated conversion tests and packaged GUI smoke test passed before packaging. Installed Microsoft Excel / Hancom HWP integration requires separate manual acceptance testing. Read README.md before processing sensitive documents. Source: ${{ github.sha }}"
